<title>Visiting Card — Asrith Cheepurupalli</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #f5f5f7;
  padding: 48px 20px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-container {
  perspective: 1000px;
}
.card {
  width: 350px;
  height: 200px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border-radius: 16px;
  padding: 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -50%;
  width: 200px;
  height: 200px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
}
.logo {
  font-size: 20px;
  font-weight: 700;
  color: white;
  letter-spacing: -0.5px;
}
.name {
  font-size: 24px;
  font-weight: 700;
  color: white;
  margin-bottom: 4px;
  letter-spacing: -0.5px;
}
.title {
  font-size: 14px;
  color: rgba(255,255,255,0.85);
  margin-bottom: 20px;
}
.contact-info {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.contact-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: rgba(255,255,255,0.9);
}
.icon {
  width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.print-note {
  text-align: center;
  margin-top: 32px;
  color: #86868b;
  font-size: 14px;
}
@media print {
  body {
    background: white;
    padding: 0;
  }
  .print-note {
    display: none;
  }
  .card {
    box-shadow: none;
  }
}
@media (max-width: 400px) {
  .card {
    width: 100%;
    max-width: 350px;
  }
}
</style>

<div class="card-container">
  <div class="card">
    <div class="logo">made.</div>
    <div>
      <div class="name">Asrith Cheepurupalli</div>
      <div class="title">Founder & Developer</div>
      <div class="contact-info">
        <div class="contact-row">
          <div class="icon">📧</div>
          <div>loksaiasrith123@gmail.com</div>
        </div>
        <div class="contact-row">
          <div class="icon">🌐</div>
          <div>made-by-ac.com</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="print-note">
