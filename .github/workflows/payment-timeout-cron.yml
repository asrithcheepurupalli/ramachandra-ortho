# Cancels payment_pending appointments older than 30 minutes.
# Runs every 5 minutes via GitHub Actions and POSTs to the clinic's
# payment-timeout route on Vercel. The route is CRON_SECRET-gated
# (same secret in this repo's Actions secrets and the Vercel env).
# Idempotent: each tick only touches rows that are still payment_pending.
name: payment-timeout-cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# A run that overlaps the previous one is a waste (the route is idempotent,
# so a second tick just finds nothing to do) and can stack queue lag on a
# slow GitHub. Cancel any in-flight run and start fresh.
concurrency:
  group: payment-timeout-cron
  cancel-in-progress: true

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger payment-timeout cron on Vercel
        env:
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            # Fail loudly: a missing secret means the cron is silently not
            # expiring anything. A green run that does nothing is how payment
            # holds go stale unnoticed — this makes it visible in the Actions UI.
            echo "CRON_SECRET not configured in repo secrets — payment-timeout cron is NOT running"
            exit 1
          fi
          code=$(curl -sS -o /tmp/payment-timeout.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${SECRET}" \
            "https://rcorthocare.made-by-ac.com/api/cron/payment-timeout")
          echo "Payment-timeout cron -> HTTP $code"
          cat /tmp/payment-timeout.json
          echo
          [ "$code" = "200" ]