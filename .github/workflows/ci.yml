# CI: lint + test + typecheck + build on every push/PR. The cron workflows
# already run in this repo; this one guards the code that ships. Runs the same
# checks a developer runs locally, so a broken build or a failing test surfaces
# on the PR instead of after main auto-deploys to production.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per PR at a time — a new push cancels the stale run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  # Deploy to Vercel only after check passes and only on pushes to main.
  # Uses a Deploy Hook (Project Settings → Deploy Hooks in Vercel dashboard)
  # rather than the CLI — no token auth or project-linking issues.
  # vercel.json's ignoreCommand skips Vercel's own git-triggered auto-deploy;
  # deploy hooks bypass ignoreCommand so only this CI path reaches production.
  #
  # Required GitHub repo secret:
  #   VERCEL_DEPLOY_HOOK_URL — copy from Vercel → Project → Settings → Deploy Hooks
  deploy:
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel production deploy
        run: curl -fsSX POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"