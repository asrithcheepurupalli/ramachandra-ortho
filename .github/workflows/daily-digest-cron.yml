# End-of-day reconciliation email for Ramachandra Ortho Care.
# POSTs to the clinic's daily-digest route once a day at 9:00 PM IST (15:30
# UTC); the route lists every one of today's active appointments (Morning +
# Evening) and emails the clinic admin a single cross-check digest before
# closing, idempotent per IST date. Runs here on GitHub Actions instead of
# Vercel cron so this keeps working on any Vercel plan, with no plan upgrade.
# The route is CRON_SECRET-gated — the same CRON_SECRET value must exist in
# BOTH this repo's Actions secrets and the Vercel project's environment, or
# the call 401s and the job fails.
name: daily-digest-cron

on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch: {}

# Overlapping runs would just re-send the same day's digest twice — cancel any
# in-flight run and start fresh.
concurrency:
  group: daily-digest-cron
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger daily digest cron on Vercel
        env:
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            # Fail loudly: a missing secret means the digest is silently not
            # sending anything. A green run that does nothing is how the
            # end-of-day reconciliation goes unnoticed — this makes it visible
            # in the Actions UI.
            echo "CRON_SECRET not configured in repo secrets — daily digest cron is NOT running"
            exit 1
          fi
          code=$(curl -sSL --location-trusted -o /tmp/digest.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${SECRET}" \
            "https://ramachandraorthocare.com/api/cron/daily-digest")
          echo "Daily digest cron -> HTTP $code"
          cat /tmp/digest.json
          echo
          [ "$code" = "200" ]
