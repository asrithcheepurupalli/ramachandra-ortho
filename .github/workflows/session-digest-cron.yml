# Pre-session email digests for Ramachandra Ortho Care.
# POSTs to the clinic's session-digest route every 15 minutes; the route finds
# today's sessions that are about to start (within a 45-minute lead) and emails
# the clinic a list of everyone booked for that session, idempotent per
# (date, window_start). Runs here on GitHub Actions instead of Vercel cron so
# this keeps working on any Vercel plan, with no plan upgrade. The route is
# CRON_SECRET-gated — the same CRON_SECRET value must exist in BOTH this repo's
# Actions secrets and the Vercel project's environment, or the call 401s and
# the job fails.
name: session-digest-cron

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger session digest cron on Vercel
        env:
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            # Fail loudly: a missing secret means the cron is silently not
            # sending anything. A green run that does nothing is how a session
            # digest goes unnoticed — this makes it visible in the Actions UI.
            echo "CRON_SECRET not configured in repo secrets — session digest cron is NOT running"
            exit 1
          fi
          code=$(curl -sS -o /tmp/session-digest.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${SECRET}" \
            "https://rcorthocare.made-by-ac.com/api/cron/session-digest")
          echo "Session digest cron -> HTTP $code"
          cat /tmp/session-digest.json
          echo
          [ "$code" = "200" ]
