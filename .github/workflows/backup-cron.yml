# Posts a daily DB backup: dumps patients + appointments as JSON and emails
# it as an attachment to the clinic's own inbox.
# Runs at 08:47 IST (03:17 UTC) daily.
# The route is CRON_SECRET-gated (same secret in this repo's Actions secrets
# and the Vercel env). ?test=1 dry-runs and returns row counts without sending.
name: backup-cron

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

# Overlapping runs would just resend the same day's dump twice — cancel any
# in-flight run and start fresh.
concurrency:
  group: backup-cron
  cancel-in-progress: true

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger backup cron on Vercel
        env:
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            # Fail loudly: a missing secret means the backup is silently not
            # running. A green run that does nothing is how backups go missing.
            echo "CRON_SECRET not configured in repo secrets — backup cron is NOT running"
            exit 1
          fi
          code=$(curl -sSL --location-trusted -o /tmp/backup.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${SECRET}" \
            "https://ramachandraorthocare.com/api/cron/backup")
          echo "Backup cron -> HTTP $code"
          cat /tmp/backup.json
          echo
          [ "$code" = "200" ]
