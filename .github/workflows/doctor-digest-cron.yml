# Daily doctor WhatsApp digest for Ramachandra Ortho Care.
# POSTs to the clinic's doctor-digest route once a day at 7:30 AM IST (02:00
# UTC); the route lists today's active appointments and sends the doctor a
# single summary via the approved digest template, idempotent per IST date.
# Runs here on GitHub Actions instead of Vercel cron so this keeps working on
# any Vercel plan, with no plan upgrade. The route is CRON_SECRET-gated — the
# same CRON_SECRET value must exist in BOTH this repo's Actions secrets and
# the Vercel project's environment, or the call 401s and the job fails.
name: doctor-digest-cron

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger doctor digest cron on Vercel
        env:
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "CRON_SECRET not configured in repo secrets yet — add it to enable the daily digest"
            exit 0
          fi
          code=$(curl -sS -o /tmp/digest.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${SECRET}" \
            "https://rcorthocare.made-by-ac.com/api/cron/doctor-digest")
          echo "Doctor digest cron -> HTTP $code"
          cat /tmp/digest.json
          echo
          [ "$code" = "200" ]
