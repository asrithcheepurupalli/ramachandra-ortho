# Automatic free-review-visit nudges for Ramachandra Ortho Care.
# POSTs to the clinic's free-visit-nudge route once a day at 8:00 AM IST
# (02:30 UTC); the route nudges each patient who consulted within the last 10
# days but hasn't booked their free follow-up review visit, asking them to
# come utilize it, via the approved free-review template.
# Runs here on GitHub Actions instead of Vercel cron so this keeps working on
# any Vercel plan, with no plan upgrade. The route is CRON_SECRET-gated — the
# same CRON_SECRET value must exist in BOTH this repo's Actions secrets and
# the Vercel project's environment, or the call 401s and the job fails.
name: free-visit-nudge-cron

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger free-visit nudge cron on Vercel
        env:
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            # Fail loudly: a missing secret means the cron is silently not
            # sending anything. A green run that does nothing is how a nudge
            # goes unnoticed — this makes it visible in the Actions UI.
            echo "CRON_SECRET not configured in repo secrets — free-visit nudge cron is NOT running"
            exit 1
          fi
          code=$(curl -sSL --location-trusted -o /tmp/freevis.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${SECRET}" \
            "https://ramachandraorthocare.com/api/cron/free-visit-nudge")
          echo "Free-visit nudge cron -> HTTP $code"
          cat /tmp/freevis.json
          echo
          [ "$code" = "200" ]