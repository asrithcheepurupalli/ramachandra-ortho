# Posts the bug desk digest every 6 hours: aggregates unresolved error_logs
# rows into one "issues since the last check" email for the clinic.
# Runs at 05:30 / 11:30 / 17:30 / 23:30 IST (00:00 / 06:00 / 12:00 / 18:00 UTC).
# The route is CRON_SECRET-gated (same secret in this repo's Actions secrets
# and the Vercel env). ?test=1 dry-runs the plan without sending.
name: bugdesk-digest-cron

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: {}

# Overlapping runs are harmless (each skips rows already marked) but wasteful —
# cancel any in-flight run and start fresh.
concurrency:
  group: bugdesk-digest-cron
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger bugdesk digest cron on Vercel
        env:
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            # Fail loudly: a missing secret means the digest is silently not
            # running. A green run that does nothing is how bugs go unread.
            echo "CRON_SECRET not configured in repo secrets — bugdesk digest cron is NOT running"
            exit 1
          fi
          code=$(curl -sS -o /tmp/bugdesk-digest.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${SECRET}" \
            "https://rcorthocare.made-by-ac.com/api/cron/bugdesk-digest")
          echo "Bug desk digest cron -> HTTP $code"
          cat /tmp/bugdesk-digest.json
          echo
          [ "$code" = "200" ]