# Automatic post-visit review nudges for Ramachandra Ortho Care.
# POSTs to the clinic's review-nudge route every 15 minutes; the route sends a
# one-time "how was your visit? leave a Google review" template to each patient
# marked done, ~3h after their slot, via the approved review template.
# Runs here on GitHub Actions instead of Vercel cron so this keeps working on
# any Vercel plan, with no plan upgrade. The route is CRON_SECRET-gated — the
# same CRON_SECRET value must exist in BOTH this repo's Actions secrets and
# the Vercel project's environment, or the call 401s and the job fails.
name: review-nudge-cron

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger review nudge cron on Vercel
        env:
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            # Fail loudly: a missing secret means the cron is silently not
            # sending anything. A green run that does nothing is how a nudge
            # goes unnoticed — this makes it visible in the Actions UI.
            echo "CRON_SECRET not configured in repo secrets — review nudge cron is NOT running"
            exit 1
          fi
          code=$(curl -sSL --location-trusted -o /tmp/review.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${SECRET}" \
            "https://ramachandraorthocare.com/api/cron/review-nudge")
          echo "Review nudge cron -> HTTP $code"
          cat /tmp/review.json
          echo
          [ "$code" = "200" ]