# Automatic WhatsApp appointment reminders for Ramachandra Ortho Care.
# POSTs to the clinic's reminder route every 15 minutes; the route decides
# WHEN each reminder is due (7:00 PM IST the evening before, or the 60-minute
# same-day net) and sends idempotently via the approved reminder template.
# Runs here on GitHub Actions instead of Vercel cron so reminders keep working
# on any Vercel plan, with no plan upgrade. The route is CRON_SECRET-gated —
# the same CRON_SECRET value must exist in BOTH this repo's Actions secrets
# and the Vercel project's environment, or the call 401s and the job fails.
name: appointment-reminder-cron

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder cron on Vercel
        env:
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            # Fail loudly: a missing secret means the cron is silently not
            # sending anything. A green run that does nothing is how a
            # reminder goes unnoticed — this makes it visible in the Actions UI.
            echo "CRON_SECRET not configured in repo secrets — reminder cron is NOT running"
            exit 1
          fi
          code=$(curl -sSL --location-trusted -o /tmp/reminder.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${SECRET}" \
            "https://ramachandraorthocare.com/api/cron/reminders")
          echo "Reminder cron -> HTTP $code"
          cat /tmp/reminder.json
          echo
          [ "$code" = "200" ]